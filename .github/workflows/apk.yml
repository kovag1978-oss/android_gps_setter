# https://github.com/marketplace/actions/automated-build-android-app-with-github-action
# https://github.com/marketplace/actions/publish-release

name: Generate APK

env:
  main_project_module: app
  target_owner: Xposed-Modules-Repo
  target_repo: io.github.kovag1978_oss.gpssetter
  target_path: target_path

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'v*.*.*'
        required: true
        type: string
  # schedule:
  #   - cron: '0 0 1 */2 *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set TAG
        if: github.event_name == 'push'
        run: |
          echo "version=$(echo '${{ github.ref_name }}' | awk -F 'v' '{print $2}')" >> $GITHUB_ENV

      - name: Set TAG
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "version=$(echo '${{ inputs.version }}' | awk -F 'v' '{print $2}')" >> $GITHUB_ENV

      - name: Set ENV
        run: | 
          echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV;
          echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Use JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # 21
          cache: 'gradle'

      - name: Build
        run: |
          echo ${{ secrets.STORE }} | base64 -d > upload.jks
          echo ${{ secrets.LOCAL }} | base64 -d > local.properties
          chmod +x ./gradlew;
          ./gradlew :app:assembleFossRelease :app:assembleFullRelease --stacktrace
          rm upload.jks local.properties

      # - name: Upload
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ env.repository_name }} - ${{ env.date_today }}
      #     path: ${{ env.main_project_module }}/build/outputs/apk/

      - name: Publish (GitHub)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          body: |
            ## Changes
            - Show active spoofed locations on the map with colored app markers; nearby markers cluster into visible color dots and expand into a spider layout when tapped.
            - Configure each managed app's voice command and map marker color in its profile.
            - Keep active location notifications ongoing and run a foreground service while system or app-specific spoofing is active.
            - Localize the voice stop command to the app language (“turn off” in English and “выключить” in Russian) across recognition, prompts, and reserved app commands.
            - Clarify the two-step voice prompts and pause before step two.

            ## Изменения
            - Активные подменённые геопозиции отображаются на карте цветными маркерами приложений; близкие точки объединяются в кластеры с видимыми цветными точками и раскрываются «паучком» по нажатию.
            - Для каждого управляемого приложения в профиле настраиваются голосовая команда и цвет маркера.
            - Уведомления активной подмены нельзя смахнуть; foreground service работает, пока активна системная или приложенческая подмена.
            - Команда остановки соответствует языку приложения («выключить» на русском, “turn off” на английском) в распознавании, подсказках и проверке команд приложений.
            - Два шага голосового управления явно подписаны; перед вторым шагом добавлена пауза.
          files: |
            ${{ env.main_project_module }}/build/outputs/apk/foss/release/app-foss-arm64-v8a-release.apk
            ${{ env.main_project_module }}/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk

      - name: Publish (Xposed)
        if: vars.LSPOSED_REPO_READY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PAT }}
          repository: Xposed-Modules-Repo/io.github.kovag1978_oss.gpssetter
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          body: |
            ## Changes
            - Show active spoofed locations on the map with colored app markers; nearby markers cluster into visible color dots and expand into a spider layout when tapped.
            - Configure each managed app's voice command and map marker color in its profile.
            - Keep active location notifications ongoing and run a foreground service while system or app-specific spoofing is active.
            - Localize the voice stop command to the app language (“turn off” in English and “выключить” in Russian) across recognition, prompts, and reserved app commands.
            - Clarify the two-step voice prompts and pause before step two.

            ## Изменения
            - Активные подменённые геопозиции отображаются на карте цветными маркерами приложений; близкие точки объединяются в кластеры с видимыми цветными точками и раскрываются «паучком» по нажатию.
            - Для каждого управляемого приложения в профиле настраиваются голосовая команда и цвет маркера.
            - Уведомления активной подмены нельзя смахнуть; foreground service работает, пока активна системная или приложенческая подмена.
            - Команда остановки соответствует языку приложения («выключить» на русском, “turn off” на английском) в распознавании, подсказках и проверке команд приложений.
            - Два шага голосового управления явно подписаны; перед вторым шагом добавлена пауза.
          files: |
            ${{ env.main_project_module }}/build/outputs/apk/foss/release/app-foss-arm64-v8a-release.apk
            ${{ env.main_project_module }}/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk

      - name: Checkout
        if: vars.LSPOSED_REPO_READY == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.target_owner }}/${{ env.target_repo }}
          path: ${{ env.target_path }}
          token: ${{ secrets.PAT }}
          # sparse-checkout: |
          #     README.md
          # sparse-checkout-cone-mode: false
      
      - name: Sync
        if: vars.LSPOSED_REPO_READY == 'true'
        run: |
          cd ${{ env.target_path }}
          cp ../README.md ../LICENSE .
          printf '%s\n' "https://github.com/${GITHUB_REPOSITORY}" > SOURCE_URL
          printf '%s\n' "Voice-switch saved locations from Quick Settings; spoof GPS system-wide or per app." > SUMMARY
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md LICENSE SOURCE_URL SUMMARY
          git commit --amend --no-edit
          git push --force
      
