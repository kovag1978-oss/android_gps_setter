# https://github.com/marketplace/actions/automated-build-android-app-with-github-action
# https://github.com/marketplace/actions/publish-release

name: Generate APK

env:
  main_project_module: app
  target_owner: Xposed-Modules-Repo
  target_repo: io.github.kovag1978_oss.gpssetter
  target_path: target_path

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'v*.*.*'
        required: true
        type: string
  # schedule:
  #   - cron: '0 0 1 */2 *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set TAG
        if: github.event_name == 'push'
        run: |
          echo "version=$(echo '${{ github.ref_name }}' | awk -F 'v' '{print $2}')" >> $GITHUB_ENV

      - name: Set TAG
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "version=$(echo '${{ inputs.version }}' | awk -F 'v' '{print $2}')" >> $GITHUB_ENV

      - name: Set ENV
        run: | 
          echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV;
          echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Use JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # 21
          cache: 'gradle'

      - name: Build
        run: |
          echo ${{ secrets.STORE }} | base64 -d > upload.jks
          echo ${{ secrets.LOCAL }} | base64 -d > local.properties
          chmod +x ./gradlew;
          ./gradlew :app:assembleFossRelease :app:assembleFullRelease --stacktrace
          rm upload.jks local.properties

      # - name: Upload
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ env.repository_name }} - ${{ env.date_today }}
      #     path: ${{ env.main_project_module }}/build/outputs/apk/

      - name: Publish (GitHub)
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          body: |
            ## Changes
            - Add per-app location profiles with unique voice commands and independent coordinates.
            - Apply a selected location to one managed app or all enabled apps; stop one active profile or all profiles from the main screen.
            - Show a separate persistent notification for every active managed app.
            - Improve Quick Settings voice control: a favorite spoken first applies to all enabled apps; an app command selects a target for the next recognition step.
            - List available app commands and saved favorites in the speech-recognition prompt.
            - Add Google Play services and Google Services Framework to the managed-app picker when installed.
            - Refresh Xposed preferences so updated coordinates take effect while spoofing is active.
            - Remove outdated joystick and Xposed-scope entries from Settings; target apps still need to be enabled manually in the Xposed manager.

            ## Изменения
            - Добавлены отдельные профили геолокации приложений, уникальные голосовые команды и независимые координаты.
            - На главном экране можно применить место к одному приложению или всем включённым; остановить один активный профиль или все профили.
            - Для каждого активного управляемого приложения показывается отдельное постоянное уведомление.
            - Улучшено голосовое управление через быстрые настройки: избранное, названное первым, применяется ко всем включённым приложениям; команда приложения выбирает цель для следующего распознавания.
            - Подсказка распознавания перечисляет команды приложений и сохранённые избранные места.
            - В список управляемых приложений добавлены Сервисы Google Play и Сервисы Google, если они установлены.
            - Xposed-настройки перечитываются, чтобы новые координаты применялись без остановки подмены.
            - Удалены устаревшие пункты настроек джойстика и области действия Xposed; целевые приложения по-прежнему нужно вручную включать в Xposed-менеджере.
          files: |
            ${{ env.main_project_module }}/build/outputs/apk/foss/release/app-foss-arm64-v8a-release.apk
            ${{ env.main_project_module }}/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk

      - name: Publish (Xposed)
        if: vars.LSPOSED_REPO_READY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PAT }}
          repository: Xposed-Modules-Repo/io.github.kovag1978_oss.gpssetter
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          body: |
            ## Changes
            - Add per-app location profiles with unique voice commands and independent coordinates.
            - Apply a selected location to one managed app or all enabled apps; stop one active profile or all profiles from the main screen.
            - Show a separate persistent notification for every active managed app.
            - Improve Quick Settings voice control: a favorite spoken first applies to all enabled apps; an app command selects a target for the next recognition step.
            - List available app commands and saved favorites in the speech-recognition prompt.
            - Add Google Play services and Google Services Framework to the managed-app picker when installed.
            - Refresh Xposed preferences so updated coordinates take effect while spoofing is active.
            - Remove outdated joystick and Xposed-scope entries from Settings; target apps still need to be enabled manually in the Xposed manager.

            ## Изменения
            - Добавлены отдельные профили геолокации приложений, уникальные голосовые команды и независимые координаты.
            - На главном экране можно применить место к одному приложению или всем включённым; остановить один активный профиль или все профили.
            - Для каждого активного управляемого приложения показывается отдельное постоянное уведомление.
            - Улучшено голосовое управление через быстрые настройки: избранное, названное первым, применяется ко всем включённым приложениям; команда приложения выбирает цель для следующего распознавания.
            - Подсказка распознавания перечисляет команды приложений и сохранённые избранные места.
            - В список управляемых приложений добавлены Сервисы Google Play и Сервисы Google, если они установлены.
            - Xposed-настройки перечитываются, чтобы новые координаты применялись без остановки подмены.
            - Удалены устаревшие пункты настроек джойстика и области действия Xposed; целевые приложения по-прежнему нужно вручную включать в Xposed-менеджере.
          files: |
            ${{ env.main_project_module }}/build/outputs/apk/foss/release/app-foss-arm64-v8a-release.apk
            ${{ env.main_project_module }}/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk

      - name: Checkout
        if: vars.LSPOSED_REPO_READY == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.target_owner }}/${{ env.target_repo }}
          path: ${{ env.target_path }}
          token: ${{ secrets.PAT }}
          # sparse-checkout: |
          #     README.md
          # sparse-checkout-cone-mode: false
      
      - name: Sync
        if: vars.LSPOSED_REPO_READY == 'true'
        run: |
          cd ${{ env.target_path }}
          cp ../README.md ../LICENSE .
          printf '%s\n' "https://github.com/${GITHUB_REPOSITORY}" > SOURCE_URL
          printf '%s\n' "Voice-switch saved locations from Quick Settings; spoof GPS system-wide or per app." > SUMMARY
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md LICENSE SOURCE_URL SUMMARY
          git commit --amend --no-edit
          git push --force
      
